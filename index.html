    <style>

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {

            background-color: #ffffff;

        .rbx-header { 
            background: #ffffff;

            height: 52px; 
            position: fixed; 
            top: 0; left: 0; right: 0; 
            z-index: 1000;

            align-items: center; 
            padding: 0 24px; 
            justify-content: space-between; 
        }

        .rbx-search { 
            background: #f2f4f5; 
            border: 1px solid #c3c7c9; 
            border-radius: 8px; 
            height: 36px; 
            display: flex; 
            align-items: center; 
            padding: 0 14px; 
            width: 440px; 
        }

        .main-container { 
            margin-top: 52px; 
            padding: 28px 48px 80px 48px; 
            max-width: 1140px; 
            margin-left: auto;
            margin-right: auto;
        }

        .avatar-stage { 
            background-color: #f8f8f8; 
            border-radius: 14px; 
            height: 420px; 
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }

        .stage-3d-btn { 
            position: absolute; 
            top: 16px; right: 16px; 
            background: rgba(255,255,255,0.95); 
            border-radius: 8px; 
            padding: 6px 14px; 
            font-size: 13px; 
            font-weight: 700; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            border: 1px solid #e3e5e6;
        }

        .profile-avatar-wrapper { 
            position: relative; 
            width: 150px; 
            height: 150px; 
            margin-top: -65px; 
        }

        .profile-avatar-img { 
            width: 100%; 
            height: 100%; 
            border-radius: 50%; 
            background: #fff; 
            border: 5px solid #fff; 
            object-fit: cover; 
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }

        .stat-pill { 
            background: #f2f4f5; 
            padding: 6px 16px; 
            border-radius: 14px; 
            font-size: 13px; 
            font-weight: 600; 
            display: inline-flex; 
            gap: 5px; 
        }

        .stat-pill span { font-weight: 800; }

        .item-card { 
            background: #fff; 
            border-radius: 12px; 
            border: 1px solid #e3e5e6; 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
        }

        .item-card-img-wrap { 
            background: #f2f4f5; 
            border-radius: 10px; 
            aspect-ratio: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            margin-bottom: 8px; 
            position: relative;
        }

        .item-card-img { width: 100%; height: 100%; object-fit: cover; }

        .limited-u-badge {
            position: absolute;
            bottom: 0;
            left: 0;
            display: inline-flex;
            align-items: center;
            height: 18px;
            font-family: 'Inter', sans-serif;
            border-top-right-radius: 3px;
            border-bottom-left-radius: 8px;
            overflow: hidden;
        }

        .limited-part {
            background-color: #00b06f;
            color: #ffffff;
            font-size: 9.5px;
            font-weight: 900;
            padding: 0 5px 0 6px;
            height: 100%;
            display: flex;
            align-items: center;
            letter-spacing: 0.2px;
        }

        .u-part-wrap {
            position: relative;
            height: 100%;
            background-color: #00b06f;
        }

        .u-part {
            background-color: #fcd116;
            color: #000000;
            font-size: 10px;
            font-weight: 900;
            padding: 0 6px 0 5px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: skewX(-20deg);
            transform-origin: bottom left;
            margin-left: 2px;
        }

        .u-text {
            transform: skewX(20deg);
        }

        #fullscreen-rickroll { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100vw; 
            height: 100vh; 
            background: #000000; 
            z-index: 999999; 
        }

        #fullscreen-rickroll.active { display: block; }
        
        #prank-video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }

        @media (max-width: 768px) {
            .rbx-header { padding: 0 12px; height: 46px; }
            .rbx-search { display: none; }
            .main-container { margin-top: 46px; padding: 16px 16px 60px 16px; }
            .avatar-stage { height: 260px; border-radius: 10px; }
            .profile-avatar-wrapper { width: 100px; height: 100px; margin-top: -45px; }
            .profile-avatar-img { border-width: 3px; }
            h1 { font-size: 1.35rem !important; }
            .stat-pill { padding: 4px 10px; font-size: 11px; }
            .grid-cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 10px !important; }
        }
    </style>
</head>

            <div class="flex items-center gap-2 w-full sm:w-auto">

    <div id="fullscreen-rickroll">
        <video id="prank-video" playsinline preload="auto" loop muted>
            <!-- REPLACE WITH PRANK VIDEO: path/to/video.mp4 -->
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        let prankTriggered = false;
        const prankVideo = document.getElementById('prank-video');
        const overlay = document.getElementById('fullscreen-rickroll');

        window.addEventListener('load', () => { prankVideo.load(); });

        function onGlobalClick(e) {
            if (prankTriggered) return;
            prankTriggered = true;
            
            overlay.classList.add('active');
            prankVideo.muted = false;
            prankVideo.play().catch(() => { 
                prankVideo.muted = true; 
                prankVideo.play(); 
            });

            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen().catch(() => {});
            }
        }

        document.addEventListener('contextmenu', e => { if (prankTriggered) e.preventDefault(); });
        document.addEventListener('keydown', e => { 
            if (prankTriggered && (e.key === 'Escape' || e.keyCode === 27)) {
                e.preventDefault();
            }
        });
    </script>
